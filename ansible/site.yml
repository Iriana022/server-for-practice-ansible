---
- name: Exercice TP IA
  hosts: servers
  vars:
    app_name: "JS SaaS B2B"
    app_host: "{{ ansible_facts['hostname'] }}"
    app_dist: "{{ ansible_facts['distribution'] }}"
    app_version: "{{ ansible_facts['distribution_version'] }}"
  become: true
  
  tasks:
    - name: Créer un dossier de test pour la TP
      ansible.builtin.file:
        state: directory
        mode: '0755'
        path: /opt/tp_ansible
    
    - name: Créer un fichier
      ansible.builtin.copy:
        content: "Hello world !"
        dest: /opt/tp_ansible/bienvenue.txt

    - name: Créer un groupe
      ansible.builtin.group:
        name: devops
        state: present

    - name: créer un utilisateur
      ansible.builtin.user:
        name: deploy
        state: present
        group: devops

    - name: Attribuer un dossier a un utilisateurs
      ansible.builtin.file:
        state: directory
        path: /opt/tp_ansible
        mode: '0640'
        owner: deploy
        group: devops

    - name: installation de git dans le serveut
      ansible.builtin.apt:
        name: git
        state: present

    - name: Generer info sur le serveur cible
      ansible.builtin.template:
        src: templates/info.txt.j2
        dest: /opt/tp_ansible/info.txt

    - name: Cloner un dossier distant
      ansible.builtin.git:
        dest: /opt/tp_ansible/mon_app
        repo: 'https://github.com/Iriana022/Odoo-mini_fleet.git'
        key_file: C:\Users\stagiaire.dev\.ssh\id_rsa

    - name: Créer des utilisateurs si l'OS est famille debian
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
      loop:
        - user1
        - user2
        - user3
      when: ansible_facts['os_family'] == "Debian"